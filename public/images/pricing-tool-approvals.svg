        <text x="0" y="22" fill="#64748B" font-size="13">Real-time comparison against prior fiscal year averages</text>

        <!-- Visual Bar Chart of Cost Elements -->
        <g transform="translate(0, 50)">
          <!-- Bar 1: Direct Labor -->
          <text x="0" y="18" fill="#334155" font-size="12" font-weight="600">Direct Labor (48.1%)</text>
          <text x="724" y="18" fill="#0F172A" font-size="12" font-weight="700" text-anchor="end" class="mono">$684,200.00</text>
          <rect x="0" y="26" width="724" height="14" rx="7" fill="#EEF2FF"/>
          <rect x="0" y="26" width="348" height="14" rx="7" fill="#4F46E5"/>

          <!-- Bar 2: Fringe Benefits -->
