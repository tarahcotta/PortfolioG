            <text x="0" y="18" fill="#334155" font-size="12" font-weight="600">Fringe Benefits (16.2%)</text>
            <text x="724" y="18" fill="#0F172A" font-size="12" font-weight="700" text-anchor="end" class="mono">$230,120.00</text>
            <rect x="0" y="26" width="724" height="14" rx="7" fill="#EEF2FF"/>
            <rect x="0" y="26" width="117" height="14" rx="7" fill="#6366F1"/>
          </g>

          <!-- Bar 3: Laboratory Overhead -->
          <g transform="translate(0, 108)">
            <text x="0" y="18" fill="#334155" font-size="12" font-weight="600">General Lab Overhead (19.8%)</text>
            <text x="724" y="18" fill="#0F172A" font-size="12" font-weight="700" text-anchor="end" class="mono">$281,980.00</text>
            <rect x="0" y="26" width="724" height="14" rx="7" fill="#EEF2FF"/>
            <rect x="0" y="26" width="143" height="14" rx="7" fill="#818CF8"/>
          </g>

          <!-- Bar 4: Subcontracts & Materials -->
          <g transform="translate(0, 162)">
            <text x="0" y="18" fill="#334155" font-size="12" font-weight="600">Subcontracts &amp; Materials (15.9%)</text>
            <text x="724" y="18" fill="#0F172A" font-size="12" font-weight="700" text-anchor="end" class="mono">$224,200.00</text>
            <rect x="0" y="26" width="724" height="14" rx="7" fill="#EEF2FF"/>
            <rect x="0" y="26" width="115" height="14" rx="7" fill="#A5B4FC"/>
