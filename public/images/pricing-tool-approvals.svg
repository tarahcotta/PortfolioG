    <!-- RIGHT: RATE COMPARATIVE MATRIX & EPM PAYLOAD (Width: 780) -->
    <g transform="translate(708, 0)" filter="url(#pt2-shadow)">
      <rect width="796" height="780" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

      <g transform="translate(36, 36)">
