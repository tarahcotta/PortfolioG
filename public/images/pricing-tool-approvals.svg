<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <filter id="pt2-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1000" fill="#F8FAFC"/>

  <!-- Top App Navigation Bar -->
  <rect width="1600" height="68" fill="#1E1B4B"/>
  <g transform="translate(32, 17)">
    <rect width="34" height="34" rx="8" fill="#4F46E5"/>
    <path d="M10 24 L16 16 L22 20 L27 8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="48" y="15" fill="#FFFFFF" font-size="14" font-weight="800">NATIONAL LABORATORY OF THE ROCKIES</text>
    <text x="48" y="29" fill="#C7D2FE" font-size="10" font-weight="600" letter-spacing="1">PRICING TOOL · GOVERNED APPROVAL CHAIN &amp; EPM INTEGRATION</text>
  </g>

  <!-- Top Info Bar -->
  <rect y="68" width="1600" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(48, 108)">
    <text x="0" y="0" fill="#0F172A" font-size="18" font-weight="800">EST-2024-8841: Multi-Stage Approval Routing &amp; EPM Handshake</text>
    <text x="640" y="0" fill="#64748B" font-size="13">Turnaround acceleration: 60% faster than previous email &amp; spreadsheet cycle</text>
  </g>

  <!-- MAIN SPLIT WORKSPACE -->
  <g transform="translate(48, 156)">
    
    <!-- LEFT: APPROVAL CHAIN STEPPER (Width: 680) -->
    <g filter="url(#pt2-shadow)">
      <rect width="680" height="780" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      
      <g transform="translate(36, 36)">
        <text x="0" y="0" fill="#0F172A" font-size="18" font-weight="800">Role-Aware Authorization Pipeline</text>
        <text x="0" y="22" fill="#64748B" font-size="13">Enforces programmatic signatory validation across 4 institutional roles.</text>

        <!-- STAGE 1: PROJECT LEAD SIGN-OFF -->
        <g transform="translate(0, 56)">
          <rect width="608" height="120" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
          <circle cx="36" cy="36" r="16" fill="#10B981"/>
          <text x="36" y="41" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">✓</text>
          
          <g transform="translate(70, 26)">
            <text x="0" y="0" fill="#065F46" font-size="14" font-weight="800">Stage 1: Project Lead Certification</text>
            <text x="0" y="18" fill="#047857" font-size="12">Dr. Elena Martinez · Certified Technical Scope &amp; Hours</text>
            <text x="0" y="38" fill="#64748B" font-size="11">Signed digitally on Oct 14, 2024 at 09:42 AM MT</text>
          </g>

          <rect x="480" y="20" width="108" height="26" rx="6" fill="#DCFCE7"/>
          <text x="534" y="37" fill="#15803D" font-size="11" font-weight="700" text-anchor="middle">APPROVED</text>
        </g>

        <!-- STAGE 2: DIRECTORATE REVIEW & DELEGATE -->
        <g transform="translate(0, 196)">
          <rect width="608" height="130" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
          <circle cx="36" cy="36" r="16" fill="#10B981"/>
          <text x="36" y="41" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">✓</text>
          
          <g transform="translate(70, 26)">
            <text x="0" y="0" fill="#065F46" font-size="14" font-weight="800">Stage 2: Directorate Budget Validation</text>
            <text x="0" y="18" fill="#047857" font-size="12">Marcus Adams (Delegate for Directorate VP)</text>
            <text x="0" y="38" fill="#64748B" font-size="11">Verified Labor Grade compliance &amp; subcontractor ratios</text>
            <text x="0" y="56" fill="#2563EB" font-size="11" font-weight="600">Delegate Signature Protocol Active</text>
          </g>

          <rect x="480" y="20" width="108" height="26" rx="6" fill="#DCFCE7"/>
          <text x="534" y="37" fill="#15803D" font-size="11" font-weight="700" text-anchor="middle">DELEGATE SIGNED</text>
        </g>

        <!-- STAGE 3: FINANCIAL ANALYST (CURRENT ACTIVE GATE) -->
        <g transform="translate(0, 346)">
          <rect width="608" height="150" rx="12" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/>
          <circle cx="36" cy="36" r="16" fill="#4F46E5"/>
          <text x="36" y="41" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">3</text>
          
          <g transform="translate(70, 26)">
            <text x="0" y="0" fill="#312E81" font-size="14" font-weight="800">Stage 3: Enterprise Financial Analyst Verification</text>
            <text x="0" y="18" fill="#4338CA" font-size="12">Assigned: Cynthia Morales (Sr Financial Analyst)</text>
            <text x="0" y="38" fill="#64748B" font-size="11">Burden Rate Validation against FY2024 Lab Guidelines</text>

            <rect x="0" y="52" width="220" height="34" rx="6" fill="#4F46E5"/>
            <text x="110" y="73" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Execute Final Sign-off</text>

            <rect x="230" y="52" width="140" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
            <text x="300" y="73" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Request Revision</text>
          </g>

          <rect x="480" y="20" width="108" height="26" rx="6" fill="#E0E7FF"/>
          <text x="534" y="37" fill="#3730A3" font-size="11" font-weight="700" text-anchor="middle">IN REVIEW</text>
        </g>

        <!-- STAGE 4: AUTOMATED EPM PUSH -->
        <g transform="translate(0, 516)">
          <rect width="608" height="110" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
          <circle cx="36" cy="36" r="16" fill="#E2E8F0"/>
          <text x="36" y="41" fill="#64748B" font-size="14" font-weight="800" text-anchor="middle">4</text>
          
          <g transform="translate(70, 26)">
            <text x="0" y="0" fill="#475569" font-size="14" font-weight="700">Stage 4: Automated EPM Project Creation</text>
