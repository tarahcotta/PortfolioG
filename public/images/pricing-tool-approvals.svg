          <text x="0" y="20" fill="#64748B" font-size="12">Structured output consumed by ERP / Financial Ledger without re-keying</text>

          <rect x="0" y="32" width="724" height="280" rx="10" fill="#0F172A"/>
          <g transform="translate(20, 60)" fill="#38BDF8" font-size="12" class="mono">
            <text x="0" y="0"><tspan fill="#F43F5E">"proposalId"</tspan>: <tspan fill="#A7F3D0">"EST-2024-8841"</tspan>,</text>
            <text x="0" y="22"><tspan fill="#F43F5E">"clientEntity"</tspan>: <tspan fill="#A7F3D0">"DOE-EERE-SOLAR"</tspan>,</text>
            <text x="0" y="44"><tspan fill="#F43F5E">"totalLaborHours"</tspan>: <tspan fill="#FBBF24">4280</tspan>,</text>
            <text x="0" y="66"><tspan fill="#F43F5E">"directLaborBase"</tspan>: <tspan fill="#FBBF24">684200.00</tspan>,</text>
            <text x="0" y="88"><tspan fill="#F43F5E">"compositeBurdenRate"</tspan>: <tspan fill="#FBBF24">0.7484</tspan>,</text>
            <text x="0" y="110"><tspan fill="#F43F5E">"totalBurdenedAmount"</tspan>: <tspan fill="#FBBF24">1420500.00</tspan>,</text>
            <text x="0" y="132"><tspan fill="#F43F5E">"approvalChain"</tspan>: {</text>
            <text x="20" y="154"><tspan fill="#F43F5E">"technicalLead"</tspan>: <tspan fill="#A7F3D0">"EMARTINEZ"</tspan>, <tspan fill="#F43F5E">"status"</tspan>: <tspan fill="#A7F3D0">"SIGNED"</tspan>,</text>
            <text x="20" y="176"><tspan fill="#F43F5E">"directorateDelegate"</tspan>: <tspan fill="#A7F3D0">"MADAMS"</tspan>, <tspan fill="#F43F5E">"status"</tspan>: <tspan fill="#A7F3D0">"SIGNED"</tspan>,</text>
            <text x="20" y="198"><tspan fill="#F43F5E">"financialAnalyst"</tspan>: <tspan fill="#A7F3D0">"CMORALES"</tspan>, <tspan fill="#F43F5E">"status"</tspan>: <tspan fill="#FBBF24">"PENDING"</tspan></text>
            <text x="0" y="220">}</text>
          </g>
        </g>

        <!-- Metrics pill on bottom -->
        <g transform="translate(0, 640)">
          <rect width="724" height="60" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
          <text x="24" y="35" fill="#312E81" font-size="13" font-weight="700">Audit Compliance: 100% Traceability to Lab Chart of Accounts</text>
        </g>
      </g>
    </g>
  </g>
</svg>
