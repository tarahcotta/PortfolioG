        <text x="0" y="234" fill="#475569" font-size="13" font-weight="400">
          The team needs a computational researcher with power-system dynamics expertise
        </text>
        <text x="0" y="254" fill="#475569" font-size="13" font-weight="400">
          to benchmark transient stability under 80%+ renewable inverter penetration.
        </text>
        <text x="0" y="274" fill="#475569" font-size="13" font-weight="400">
          Work is scheduled for 8 hrs/wk across a 10-week sprint cycle.
        </text>

