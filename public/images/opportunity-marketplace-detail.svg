          <rect width="760" height="60" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
          <text x="20" y="35" fill="#64748B" font-size="12" font-weight="500">Weekly co-design session scheduled for Thursday 2:00 PM MT</text>
          <rect x="520" y="12" width="220" height="36" rx="8" fill="#0F172A"/>
          <text x="630" y="34" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Send Delegate Notification</text>
        </g>
      </g>
