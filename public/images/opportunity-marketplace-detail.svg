              <text x="0" y="0" fill="#475569" font-size="11" font-weight="700">VERIFIED SKILLS:</text>
              <g transform="translate(100, -12)">
                <rect x="0" y="0" width="80" height="24" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
                <text x="40" y="16" fill="#1D4ED8" font-size="11" font-weight="600" text-anchor="middle">✓ Python</text>

                <rect x="88" y="0" width="130" height="24" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
                <text x="153" y="16" fill="#1D4ED8" font-size="11" font-weight="600" text-anchor="middle">✓ Grid Modeling</text>

                <rect x="226" y="0" width="130" height="24" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
                <text x="291" y="16" fill="#1D4ED8" font-size="11" font-weight="600" text-anchor="middle">✓ Data Pipelines</text>
              </g>
            </g>

            <!-- Availability & Manager Status -->
            <g transform="translate(0, 114)">
              <rect width="712" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
              <text x="16" y="26" fill="#334155" font-size="12" font-weight="600">Availability: 8 hrs/wk confirmed</text>
              <text x="260" y="26" fill="#334155" font-size="12" font-weight="600">Directorate Delegate: Approved (M. Adams)</text>
              <rect x="580" y="6" width="120" height="30" rx="6" fill="#3B82F6"/>
              <text x="640" y="25" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Connected ✓</text>
            </g>
          </g>
        </g>

        <!-- CANDIDATE ROW 2: Research Contributor 2 -->
        <g transform="translate(0, 280)">
          <rect width="760" height="170" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
          
          <g transform="translate(24, 24)">
            <circle cx="24" cy="24" r="24" fill="#F1F5F9"/>
            <text x="24" y="31" fill="#475569" font-size="16" font-weight="800" text-anchor="middle">KL</text>
            
            <text x="64" y="18" fill="#0F172A" font-size="15" font-weight="700">Kenji Lin</text>
            <text x="64" y="38" fill="#64748B" font-size="12">Postdoctoral Fellow · Power Systems Integration</text>

            <rect x="620" y="0" width="90" height="28" rx="14" fill="#F0FDF4"/>
            <text x="665" y="18" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">84% Match</text>

            <g transform="translate(0, 70)">
              <text x="0" y="0" fill="#475569" font-size="11" font-weight="700">SKILLS:</text>
              <g transform="translate(60, -12)">
                <rect x="0" y="0" width="80" height="24" rx="12" fill="#F1F5F9"/>
                <text x="40" y="16" fill="#334155" font-size="11" text-anchor="middle">Python</text>

                <rect x="88" y="0" width="100" height="24" rx="12" fill="#F1F5F9"/>
                <text x="138" y="16" fill="#334155" font-size="11" text-anchor="middle">GridLAB-D</text>

                <rect x="196" y="0" width="140" height="24" rx="12" fill="#FEF2F2"/>
                <text x="266" y="16" fill="#991B1B" font-size="11" text-anchor="middle">Waitlist on Availability</text>
              </g>
            </g>
          </g>
        </g>

        <!-- CANDIDATE ROW 3: Research Contributor 3 -->
        <g transform="translate(0, 466)">
          <rect width="760" height="170" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
          
          <g transform="translate(24, 24)">
            <circle cx="24" cy="24" r="24" fill="#F1F5F9"/>
            <text x="24" y="31" fill="#475569" font-size="16" font-weight="800" text-anchor="middle">AR</text>
            
            <text x="64" y="18" fill="#0F172A" font-size="15" font-weight="700">Amira Rahman</text>
            <text x="64" y="38" fill="#64748B" font-size="12">Research Scientist · Computational Science Center</text>

            <rect x="620" y="0" width="90" height="28" rx="14" fill="#F0FDF4"/>
            <text x="665" y="18" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">81% Match</text>

            <g transform="translate(0, 70)">
              <text x="0" y="0" fill="#475569" font-size="11" font-weight="700">SKILLS:</text>
              <g transform="translate(60, -12)">
                <rect x="0" y="0" width="140" height="24" rx="12" fill="#EFF6FF"/>
                <text x="70" y="16" fill="#1D4ED8" font-size="11" text-anchor="middle">High Performance Py</text>

                <rect x="148" y="0" width="100" height="24" rx="12" fill="#F1F5F9"/>
                <text x="198" y="16" fill="#334155" font-size="11" text-anchor="middle">Simulation</text>
              </g>
            </g>
          </g>
        </g>

        <!-- Bottom Action Bar -->
