<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
    <filter id="detail-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1000" fill="#F1F5F9"/>

  <!-- Top App Navigation Bar -->
  <rect width="1600" height="68" fill="#0F172A"/>
  <g transform="translate(32, 17)">
    <rect width="34" height="34" rx="8" fill="#3B82F6"/>
    <circle cx="12" cy="12" r="3" fill="#FFFFFF"/>
    <circle cx="22" cy="12" r="3" fill="#93C5FD"/>
    <circle cx="17" cy="22" r="3" fill="#FFFFFF"/>
    <text x="48" y="16" fill="#FFFFFF" font-size="14" font-weight="800">NATIONAL LABORATORY OF THE ROCKIES</text>
    <text x="48" y="30" fill="#94A3B8" font-size="10" font-weight="600" letter-spacing="1">OPPORTUNITY MARKETPLACE · CANDIDATE ALIGNMENT MODAL</text>
  </g>

  <!-- Breadcrumb bar -->
  <rect y="68" width="1600" height="52" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(48, 100)">
    <text x="0" y="0" fill="#64748B" font-size="13" font-weight="500">← Back to Opportunity Feed</text>
    <text x="180" y="0" fill="#CBD5E1" font-size="13">/</text>
    <text x="196" y="0" fill="#3B82F6" font-size="13" font-weight="600">OPP-2024-082: Renewable Grid Stability Simulation</text>
    <text x="560" y="0" fill="#CBD5E1" font-size="13">/</text>
    <text x="576" y="0" fill="#0F172A" font-size="13" font-weight="700">Applicant Review &amp; Delegate Routing</text>
  </g>

  <!-- Main Split-Screen Container -->
  <g transform="translate(48, 144)">
    
    <!-- LEFT PANEL: Opportunity Spec Sheet (Width: 620) -->
    <g filter="url(#detail-shadow)">
      <rect width="620" height="800" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      
      <g transform="translate(36, 36)">
        <rect x="0" y="0" width="130" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
        <text x="65" y="17" fill="#1D4ED8" font-size="11" font-weight="700" text-anchor="middle">ACTIVE SPRINT</text>

        <text x="0" y="60" fill="#0F172A" font-size="22" font-weight="800">Renewable Grid Stability Simulation</text>
        <text x="0" y="82" fill="#64748B" font-size="13">Directorate: Energy Systems Integration · Lab 04</text>

        <!-- Lead details -->
        <g transform="translate(0, 108)">
          <rect width="548" height="64" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
          <circle cx="36" cy="32" r="18" fill="#E0E7FF"/>
          <text x="36" y="37" fill="#4338CA" font-size="12" font-weight="700" text-anchor="middle">EM</text>
          <text x="66" y="27" fill="#0F172A" font-size="13" font-weight="700">Dr. Elena Martinez</text>
          <text x="66" y="44" fill="#64748B" font-size="11">Lead Modeling Engineer · Primary Project Lead</text>
          
          <rect x="410" y="16" width="120" height="32" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
          <text x="470" y="36" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">Delegate: R. Torres</text>
        </g>

