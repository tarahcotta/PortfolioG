        <!-- CANDIDATE ROW 1: Tarah Cotta / Lead Match (96%) -->
        <g transform="translate(0, 54)">
          <rect width="760" height="210" rx="14" fill="#F8FAFC" stroke="#3B82F6" stroke-width="2"/>
          
          <g transform="translate(24, 24)">
