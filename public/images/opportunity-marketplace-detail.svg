          <text x="280" y="0" fill="#94A3B8" font-size="11" font-weight="700">ESTIMATED WORKLOAD</text>

          <g transform="translate(0, 16)">
            <text x="0" y="20" fill="#1E293B" font-size="13" font-weight="600">• Python 3.10+ (NumPy / SciPy)</text>
            <text x="0" y="44" fill="#1E293B" font-size="13" font-weight="600">• GridLAB-D or OpenDSS simulation</text>
            <text x="0" y="68" fill="#1E293B" font-size="13" font-weight="600">• Time-Series Data Pipelines</text>

            <text x="280" y="20" fill="#1E293B" font-size="13" font-weight="600">• 8 Hours per week</text>
            <text x="280" y="44" fill="#1E293B" font-size="13" font-weight="600">• 10 Weeks duration (80 hrs total)</text>
            <text x="280" y="68" fill="#059669" font-size="13" font-weight="700">• No financial billing re-code</text>
          </g>
        </g>

        <!-- People Strategy Equity Note -->
        <rect x="0" y="480" width="548" height="96" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
        <g transform="translate(20, 506)">
          <circle cx="12" cy="8" r="8" fill="#10B981"/>
          <text x="12" y="12" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">i</text>
          <text x="28" y="12" fill="#065F46" font-size="13" font-weight="700">People Strategy Equity Principle</text>
          <text x="0" y="38" fill="#047857" font-size="12">
