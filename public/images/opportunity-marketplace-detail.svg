            <text x="24" y="31" fill="#FFFFFF" font-size="16" font-weight="800" text-anchor="middle">TC</text>
            
            <text x="64" y="18" fill="#0F172A" font-size="16" font-weight="800">Tarah Cotta (You)</text>
            <text x="64" y="38" fill="#64748B" font-size="12">Staff Product Designer &amp; Computational UX · Enterprise Systems</text>

            <rect x="620" y="0" width="90" height="28" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
            <text x="665" y="18" fill="#065F46" font-size="12" font-weight="700" text-anchor="middle">96% Match</text>

            <!-- Skills chips -->
