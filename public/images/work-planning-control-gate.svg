<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <filter id="wpc2-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1000" fill="#09090B"/>

  <!-- Top App Navigation Bar -->
  <rect width="1600" height="68" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <g transform="translate(32, 17)">
    <rect width="34" height="34" rx="8" fill="#7C3AED"/>
    <path d="M17 10 L24 14 L24 20 C24 24 17 27 17 27 C17 27 10 24 10 20 L10 14 Z" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <text x="48" y="15" fill="#FFFFFF" font-size="14" font-weight="800">NATIONAL LABORATORY OF THE ROCKIES</text>
    <text x="48" y="29" fill="#A1A1AA" font-size="10" font-weight="600" letter-spacing="1">WPC PLATFORM · GATE 2: QUALIFICATION &amp; TRAINING AUDIT MODAL</text>
  </g>

  <!-- Modal Container -->
  <g transform="translate(100, 100)" filter="url(#wpc2-shadow)">
    <rect width="1400" height="840" rx="20" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>

    <!-- Modal Header -->
    <rect width="1400" height="80" rx="20 20 0 0" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
    <g transform="translate(40, 36)">
      <div style="display:flex">
        <rect x="0" y="0" width="100" height="24" rx="6" fill="#3B82F6"/>
        <text x="50" y="16" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">GATE 2 AUDIT</text>
        <text x="116" y="18" fill="#FFFFFF" font-size="20" font-weight="800">Personnel Credential Verification &amp; Access Authorization</text>
      </div>
      <text x="0" y="32" fill="#A1A1AA" font-size="13">Permit WP-2024-0412 · High Hazard Class 4 Laser System · Facility 10B Room 142</text>
      
      <!-- Close button on right -->
      <g transform="translate(1280, 0)">
        <circle cx="20" cy="12" r="16" fill="#3F3F46"/>
        <text x="20" y="18" fill="#D4D4D8" font-size="16" font-weight="700" text-anchor="middle">✕</text>
      </g>
    </g>

    <!-- Modal Body: 4 Staff Rows with Deep Qualification Matrix -->
    <g transform="translate(40, 110)">
      
      <!-- Table Header -->
      <rect width="1320" height="40" rx="8" fill="#27272A"/>
      <g transform="translate(20, 25)" fill="#A1A1AA" font-size="11" font-weight="700">
        <text x="0" y="0">STAFF MEMBER &amp; BADGE ID</text>
        <text x="320" y="0">ASSIGNED ROLE</text>
        <text x="520" y="0">EHS TRAINING RECORD (TMS)</text>
        <text x="860" y="0">MEDICAL SURVEILLANCE</text>
        <text x="1100" y="0">GATE 2 CLEARANCE</text>
      </g>

      <!-- STAFF ROW 1 -->
      <g transform="translate(0, 52)">
        <rect width="1320" height="96" rx="10" fill="#202024" stroke="#3F3F46" stroke-width="1"/>
        <g transform="translate(20, 32)">
          <circle cx="20" cy="18" r="18" fill="#7C3AED"/>
          <text x="20" y="24" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">EM</text>
          <text x="52" y="14" fill="#FFFFFF" font-size="14" font-weight="700">Dr. Elena Martinez</text>
          <text x="52" y="32" fill="#A1A1AA" font-size="11" class="mono">Badge: NLR-88219 (Sr Research Fellow)</text>

          <text x="320" y="22" fill="#E4E4E7" font-size="13">Principal Laser Operator</text>

          <g transform="translate(520, 4)">
            <rect width="140" height="24" rx="4" fill="#14532D"/>
            <text x="70" y="16" fill="#BBF7D0" font-size="10" font-weight="700" text-anchor="middle">Laser Safety L4 (2026)</text>
            <rect x="150" y="0" width="130" height="24" rx="4" fill="#14532D"/>
            <text x="215" y="16" fill="#BBF7D0" font-size="10" font-weight="700" text-anchor="middle">High Voltage (2025)</text>
          </g>

          <text x="860" y="22" fill="#10B981" font-size="12" font-weight="600">Laser Eye Exam Passed ✓</text>

          <rect x="1100" y="4" width="160" height="32" rx="6" fill="#059669"/>
          <text x="1180" y="24" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">AUTHORIZED ✓</text>
        </g>
      </g>

      <!-- STAFF ROW 2 -->
      <g transform="translate(0, 160)">
        <rect width="1320" height="96" rx="10" fill="#202024" stroke="#3F3F46" stroke-width="1"/>
        <g transform="translate(20, 32)">
          <circle cx="20" cy="18" r="18" fill="#3B82F6"/>
          <text x="20" y="24" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">TC</text>
          <text x="52" y="14" fill="#FFFFFF" font-size="14" font-weight="700">Tarah Cotta</text>
          <text x="52" y="32" fill="#A1A1AA" font-size="11" class="mono">Badge: NLR-49102 (Staff Product Designer)</text>

          <text x="320" y="22" fill="#E4E4E7" font-size="13">Lead Designer &amp; Context Auditor</text>

          <g transform="translate(520, 4)">
            <rect width="140" height="24" rx="4" fill="#14532D"/>
            <text x="70" y="16" fill="#BBF7D0" font-size="10" font-weight="700" text-anchor="middle">Lab Safety Level 2 (2026)</text>
            <rect x="150" y="0" width="140" height="24" rx="4" fill="#14532D"/>
            <text x="220" y="16" fill="#BBF7D0" font-size="10" font-weight="700" text-anchor="middle">Laser Observer OD 7+ (2025)</text>
          </g>

          <text x="860" y="22" fill="#10B981" font-size="12" font-weight="600">Standard Clearance Active ✓</text>

          <rect x="1100" y="4" width="160" height="32" rx="6" fill="#059669"/>
          <text x="1180" y="24" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">AUTHORIZED ✓</text>
        </g>
      </g>

      <!-- STAFF ROW 3 -->
      <g transform="translate(0, 268)">
        <rect width="1320" height="96" rx="10" fill="#202024" stroke="#3F3F46" stroke-width="1"/>
        <g transform="translate(20, 32)">
          <circle cx="20" cy="18" r="18" fill="#64748B"/>
          <text x="20" y="24" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">DM</text>
          <text x="52" y="14" fill="#FFFFFF" font-size="14" font-weight="700">David Miller</text>
          <text x="52" y="32" fill="#A1A1AA" font-size="11" class="mono">Badge: NLR-63301 (Optics Tech II)</text>

          <text x="320" y="22" fill="#E4E4E7" font-size="13">Secondary Beam Alignment</text>

          <g transform="translate(520, 4)">
            <rect width="140" height="24" rx="4" fill="#14532D"/>
            <text x="70" y="16" fill="#BBF7D0" font-size="10" font-weight="700" text-anchor="middle">Laser Safety L4 (2025)</text>
            <rect x="150" y="0" width="130" height="24" rx="4" fill="#14532D"/>
            <text x="215" y="16" fill="#BBF7D0" font-size="10" font-weight="700" text-anchor="middle">Cryo Nitrogen (2025)</text>
          </g>

          <text x="860" y="22" fill="#10B981" font-size="12" font-weight="600">Laser Eye Exam Passed ✓</text>

          <rect x="1100" y="4" width="160" height="32" rx="6" fill="#059669"/>
          <text x="1180" y="24" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">AUTHORIZED ✓</text>
        </g>
      </g>

      <!-- STAFF ROW 4 -->
      <g transform="translate(0, 376)">
        <rect width="1320" height="96" rx="10" fill="#202024" stroke="#3F3F46" stroke-width="1"/>
        <g transform="translate(20, 32)">
          <circle cx="20" cy="18" r="18" fill="#64748B"/>
          <text x="20" y="24" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">AL</text>
          <text x="52" y="14" fill="#FFFFFF" font-size="14" font-weight="700">Ananya Lewis</text>
          <text x="52" y="32" fill="#A1A1AA" font-size="11" class="mono">Badge: NLR-91402 (Research Fellow)</text>

          <text x="320" y="22" fill="#E4E4E7" font-size="13">Data Acquisition Operator</text>

          <g transform="translate(520, 4)">
            <rect width="140" height="24" rx="4" fill="#14532D"/>
            <text x="70" y="16" fill="#BBF7D0" font-size="10" font-weight="700" text-anchor="middle">Laser Safety L3 (2025)</text>
            <rect x="150" y="0" width="130" height="24" rx="4" fill="#14532D"/>
            <text x="215" y="16" fill="#BBF7D0" font-size="10" font-weight="700" text-anchor="middle">HazCom / PPE (2026)</text>
          </g>

          <text x="860" y="22" fill="#10B981" font-size="12" font-weight="600">Clearance Current ✓</text>

          <rect x="1100" y="4" width="160" height="32" rx="6" fill="#059669"/>
          <text x="1180" y="24" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">AUTHORIZED ✓</text>
        </g>
      </g>

      <!-- Bottom Compliance Certificate Box -->
      <g transform="translate(0, 490)">
        <rect width="1320" height="180" rx="12" fill="#064E3B" stroke="#059669" stroke-width="1.5"/>
        <g transform="translate(32, 36)">
          <circle cx="24" cy="24" r="24" fill="#10B981"/>
          <text x="24" y="32" fill="#FFFFFF" font-size="20" font-weight="900" text-anchor="middle">✓</text>
          
          <text x="64" y="18" fill="#ECFDF5" font-size="18" font-weight="800">Gate 2 Mandatory Verification: 100% Validated</text>
          <text x="64" y="40" fill="#A7F3D0" font-size="13">
            All 4 listed individuals possess verified, non-expired certifications in the National Laboratory database.
          </text>
          <text x="64" y="60" fill="#A7F3D0" font-size="13">
            Electronic interlock door badges have been programmatically granted for the active work window (08:00 – 18:00 MT).
          </text>

          <!-- Metrics Tag on Right -->
          <g transform="translate(940, -4)">
            <rect width="280" height="58" rx="8" fill="#047857"/>
            <text x="140" y="24" fill="#D1FAE5" font-size="11" font-weight="700" text-anchor="middle">ZERO UNQUALIFIED INCIDENTS</text>
            <text x="140" y="46" fill="#FFFFFF" font-size="16" font-weight="900" text-anchor="middle">100% Gate Enforcement</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
