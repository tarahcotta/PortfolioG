<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <filter id="wpc-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="wpc-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1000" fill="#F4F4F5"/>

  <!-- Top Safety Control Header Bar -->
  <rect width="1600" height="70" fill="url(#wpc-header)"/>
  
  <!-- Logo & Title -->
  <g transform="translate(32, 18)">
    <rect width="36" height="36" rx="8" fill="#7C3AED"/>
    <!-- Shield / Safety Gate symbol -->
    <path d="M18 10 L26 14 L26 21 C26 25 18 29 18 29 C18 29 10 25 10 21 L10 14 Z" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <path d="M15 19 L17 21 L22 16" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="50" y="16" fill="#FFFFFF" font-size="15" font-weight="800" letter-spacing="0.5">NATIONAL LABORATORY OF THE ROCKIES</text>
    <text x="50" y="31" fill="#DDD6FE" font-size="11" font-weight="600" letter-spacing="1.2">WORK PLANNING &amp; CONTROL (WPC) · SAFETY AUTHORIZATION PLATFORM</text>
  </g>

  <!-- Navigation items -->
  <g transform="translate(860, 24)">
    <rect x="0" y="-4" width="140" height="28" rx="14" fill="#7C3AED"/>
    <text x="70" y="15" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Facility 10B · Active</text>
    <text x="170" y="16" fill="#A1A1AA" font-size="12" font-weight="500">All 15 Facilities</text>
    <text x="290" y="16" fill="#A1A1AA" font-size="12" font-weight="500">Hazard Matrix</text>
    <text x="410" y="16" fill="#A1A1AA" font-size="12" font-weight="500">Worker Qualifications</text>
    <text x="560" y="16" fill="#A1A1AA" font-size="12" font-weight="500">Incident Logs</text>
  </g>

  <!-- Facility & Active Work Permit Banner -->
  <rect y="70" width="1600" height="126" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
  <g transform="translate(48, 96)">
    <!-- Permit Identifier & Hazard Class -->
    <div style="display:flex">
      <rect x="0" y="0" width="118" height="26" rx="6" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
      <text x="59" y="17" fill="#6D28D9" font-size="11" font-weight="800" text-anchor="middle" class="mono">WP-2024-0412</text>
      
      <rect x="128" y="0" width="160" height="26" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
      <text x="208" y="17" fill="#B91C1C" font-size="11" font-weight="800" text-anchor="middle">⚠️ HAZARD LEVEL 3 (HIGH)</text>

      <text x="304" y="20" fill="#18181B" font-size="20" font-weight="800">High-Power Femtosecond Laser Alignment &amp; Optical Calibration</text>
    </div>

    <!-- Metadata Location -->
    <text x="0" y="52" fill="#71717A" font-size="13">
      Location: South Campus · Facility 10B · Room 142 (Ultra-Fast Optics Lab) · EHS Safety Officer: Marcus Delgado
    </text>

    <!-- Top Right Authorization State -->
    <g transform="translate(1120, -2)">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#10B981"/>
      <text x="32" y="26" fill="#065F46" font-size="12" font-weight="800">ALL GATES VERIFIED</text>

      <rect x="176" y="0" width="156" height="42" rx="8" fill="#7C3AED"/>
      <text x="254" y="26" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Authorize Run →</text>
    </g>
  </g>

  <!-- MANDATORY SAFETY GATES STEPPER (The Core Architectural Innovation) -->
  <rect y="196" width="1600" height="74" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <g transform="translate(48, 218)">
    <text x="0" y="24" fill="#A1A1AA" font-size="11" font-weight="800" letter-spacing="1">MANDATORY GATES (100% VERIFIED):</text>

    <!-- Gate 1: Hazard Identification -->
    <g transform="translate(260, 0)">
      <rect width="260" height="36" rx="18" fill="#27272A" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="20" cy="18" r="9" fill="#10B981"/>
      <text x="20" y="22" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">✓</text>
      <text x="38" y="22" fill="#F4F4F5" font-size="11" font-weight="700">Gate 1: Hazard Analysis (EHS)</text>
    </g>

    <!-- Gate 2: Training & Qualification Check -->
    <g transform="translate(540, 0)">
      <rect width="280" height="36" rx="18" fill="#27272A" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="20" cy="18" r="9" fill="#10B981"/>
      <text x="20" y="22" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">✓</text>
      <text x="38" y="22" fill="#F4F4F5" font-size="11" font-weight="700">Gate 2: Qualifications (4/4 Staff)</text>
    </g>

    <!-- Gate 3: PPE & Engineering Controls -->
    <g transform="translate(840, 0)">
      <rect width="280" height="36" rx="18" fill="#27272A" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="20" cy="18" r="9" fill="#10B981"/>
      <text x="20" y="22" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">✓</text>
      <text x="38" y="22" fill="#F4F4F5" font-size="11" font-weight="700">Gate 3: PPE &amp; Beam Interlocks</text>
    </g>

    <!-- Gate 4: Lead Sign-off -->
    <g transform="translate(1140, 0)">
      <rect width="310" height="36" rx="18" fill="#27272A" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="20" cy="18" r="9" fill="#10B981"/>
      <text x="20" y="22" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">✓</text>
      <text x="38" y="22" fill="#F4F4F5" font-size="11" font-weight="700">Gate 4: Facility Lead Authorized</text>
    </g>
  </g>

  <!-- MAIN DASHBOARD CONTENT GRID (3 Columns) -->
  <g transform="translate(48, 290)">
    
    <!-- COL 1: ACTIVE HAZARDS & ENGINEERING CONTROLS (Width: 480) -->
    <g filter="url(#wpc-shadow)">
      <rect width="480" height="660" rx="14" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
      <g transform="translate(24, 28)">
        <text x="0" y="0" fill="#18181B" font-size="16" font-weight="800">1. Identified Hazards &amp; Controls</text>
        <text x="0" y="20" fill="#71717A" font-size="12">Mandatory engineering interlocks and barriers</text>

        <!-- Hazard Card 1: Class 4 Laser -->
        <g transform="translate(0, 42)">
          <rect width="432" height="110" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
          <text x="16" y="24" fill="#991B1B" font-size="13" font-weight="800">🔴 Laser Radiation (Class 4 · 800nm Femtosecond)</text>
          <text x="16" y="44" fill="#7F1D1D" font-size="12">Beam intensity: 12 mJ/pulse · Eye &amp; skin damage hazard</text>
          <g transform="translate(16, 58)">
            <rect width="210" height="26" rx="6" fill="#FEE2E2"/>
            <text x="105" y="17" fill="#991B1B" font-size="11" font-weight="700" text-anchor="middle">OD 7+ Goggles Required</text>

            <rect x="220" y="0" width="180" height="26" rx="6" fill="#DCFCE7"/>
            <text x="310" y="17" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">Enclosure Interlock: CLOSED ✓</text>
          </g>
        </g>

        <!-- Hazard Card 2: High Voltage -->
        <g transform="translate(0, 166)">
          <rect width="432" height="110" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
          <text x="16" y="24" fill="#92400E" font-size="13" font-weight="800">⚡ High Voltage Power Supply (15 kV DC)</text>
          <text x="16" y="44" fill="#78350F" font-size="12">Capacitor bank energy storage · Arc flash boundary 1.2m</text>
          <g transform="translate(16, 58)">
            <rect width="210" height="26" rx="6" fill="#FEF3C7"/>
            <text x="105" y="17" fill="#92400E" font-size="11" font-weight="700" text-anchor="middle">Class 0 Insulated Gloves</text>

            <rect x="220" y="0" width="180" height="26" rx="6" fill="#DCFCE7"/>
            <text x="310" y="17" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">Grounding Hook: VERIFIED ✓</text>
          </g>
        </g>

        <!-- Hazard Card 3: Cryogenic Nitrogen -->
        <g transform="translate(0, 290)">
          <rect width="432" height="110" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
          <text x="16" y="24" fill="#166534" font-size="13" font-weight="800">❄️ Cryogenic Liquid Nitrogen (Dewar System)</text>
          <text x="16" y="44" fill="#14532D" font-size="12">Oxygen displacement risk · Frostbite contact hazard</text>
          <g transform="translate(16, 58)">
            <rect width="210" height="26" rx="6" fill="#DCFCE7"/>
            <text x="105" y="17" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">O2 Sensor: 20.9% NORMAL</text>

            <rect x="220" y="0" width="180" height="26" rx="6" fill="#DCFCE7"/>
            <text x="310" y="17" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">Cryo Shielding: READY ✓</text>
          </g>
        </g>

        <!-- Impact box -->
        <g transform="translate(0, 420)">
          <rect width="432" height="180" rx="10" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1"/>
          <text x="16" y="28" fill="#18181B" font-size="13" font-weight="800">Platform Governance Benchmark</text>
          <text x="16" y="50" fill="#52525B" font-size="12">Replaced 15 disjointed spreadsheets with a unified safety record.</text>
          <line x1="16" y1="64" x2="416" y2="64" stroke="#E4E4E7" stroke-width="1"/>
          <text x="16" y="90" fill="#71717A" font-size="11" font-weight="600">LAB-WIDE REDUCTION IN ONBOARDING TIME:</text>
          <text x="16" y="122" fill="#7C3AED" font-size="28" font-weight="900">50% Faster</text>
          <text x="16" y="148" fill="#52525B" font-size="11">Centralized training transcripts eliminated verification delays.</text>
        </g>
      </g>
    </g>

    <!-- COL 2: PERSONNEL QUALIFICATIONS CHECK (Width: 500) -->
    <g transform="translate(504, 0)" filter="url(#wpc-shadow)">
      <rect width="500" height="660" rx="14" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
      <g transform="translate(24, 28)">
        <text x="0" y="0" fill="#18181B" font-size="16" font-weight="800">2. Staff Qualification Verification</text>
        <text x="0" y="20" fill="#71717A" font-size="12">Automatic integration with National Laboratory training database</text>

        <!-- Personnel 1: Lead Investigator -->
        <g transform="translate(0, 42)">
          <rect width="452" height="96" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
          <circle cx="28" cy="28" r="16" fill="#7C3AED"/>
          <text x="28" y="33" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">EM</text>
          <text x="56" y="22" fill="#18181B" font-size="13" font-weight="800">Dr. Elena Martinez (Task Lead)</text>
          <text x="56" y="38" fill="#71717A" font-size="11">Badge: NLR-88219 · Senior Research Fellow</text>
          <rect x="56" y="52" width="120" height="22" rx="4" fill="#DCFCE7"/>
          <text x="116" y="67" fill="#166534" font-size="10" font-weight="700" text-anchor="middle">Laser Safety L4 (Exp: 2026)</text>
          <rect x="184" y="52" width="120" height="22" rx="4" fill="#DCFCE7"/>
          <text x="244" y="67" fill="#166534" font-size="10" font-weight="700" text-anchor="middle">High Voltage Cert ✓</text>
        </g>

        <!-- Personnel 2: Tarah Cotta -->
        <g transform="translate(0, 150)">
          <rect width="452" height="96" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
          <circle cx="28" cy="28" r="16" fill="#3B82F6"/>
          <text x="28" y="33" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">TC</text>
          <text x="56" y="22" fill="#18181B" font-size="13" font-weight="800">Tarah Cotta (Lead Product Designer)</text>
          <text x="56" y="38" fill="#71717A" font-size="11">Badge: NLR-49102 · User Experience &amp; Architecture</text>
          <rect x="56" y="52" width="140" height="22" rx="4" fill="#DCFCE7"/>
          <text x="126" y="67" fill="#166534" font-size="10" font-weight="700" text-anchor="middle">Lab Safety Level 2 ✓</text>
          <rect x="204" y="52" width="130" height="22" rx="4" fill="#DCFCE7"/>
          <text x="269" y="67" fill="#166534" font-size="10" font-weight="700" text-anchor="middle">Laser Observer Protocol ✓</text>
        </g>

        <!-- Personnel 3: Postdoc Tech -->
        <g transform="translate(0, 258)">
          <rect width="452" height="96" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
          <circle cx="28" cy="28" r="16" fill="#64748B"/>
          <text x="28" y="33" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">DM</text>
          <text x="56" y="22" fill="#18181B" font-size="13" font-weight="800">David Miller (Laser Optics Specialist)</text>
          <text x="56" y="38" fill="#71717A" font-size="11">Badge: NLR-63301 · Technical Staff II</text>
          <rect x="56" y="52" width="120" height="22" rx="4" fill="#DCFCE7"/>
          <text x="116" y="67" fill="#166534" font-size="10" font-weight="700" text-anchor="middle">Laser Safety L4 (Exp: 2025)</text>
          <rect x="184" y="52" width="130" height="22" rx="4" fill="#DCFCE7"/>
          <text x="249" y="67" fill="#166534" font-size="10" font-weight="700" text-anchor="middle">Cryo Handling Cert ✓</text>
        </g>

        <!-- Personnel 4: Graduate Fellow -->
        <g transform="translate(0, 366)">
          <rect width="452" height="96" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
          <circle cx="28" cy="28" r="16" fill="#64748B"/>
          <text x="28" y="33" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">AL</text>
          <text x="56" y="22" fill="#18181B" font-size="13" font-weight="800">Ananya Lewis (Research Fellow)</text>
          <text x="56" y="38" fill="#71717A" font-size="11">Badge: NLR-91402 · Clean Energy Science</text>
          <rect x="56" y="52" width="130" height="22" rx="4" fill="#DCFCE7"/>
          <text x="121" y="67" fill="#166534" font-size="10" font-weight="700" text-anchor="middle">Laser Safety L3 ✓</text>
          <rect x="194" y="52" width="110" height="22" rx="4" fill="#DCFCE7"/>
          <text x="249" y="67" fill="#166534" font-size="10" font-weight="700" text-anchor="middle">CPR / First Aid ✓</text>
        </g>

        <!-- Qualification Gate Status -->
        <g transform="translate(0, 480)">
          <rect width="452" height="120" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
          <text x="16" y="26" fill="#065F46" font-size="13" font-weight="800">✓ Compliance Gate Status: 100% Passed</text>
          <text x="16" y="48" fill="#047857" font-size="12">
            No uncertified personnel are permitted in Facility 10B while beam is active.
          </text>
          <text x="16" y="68" fill="#047857" font-size="12">
            Automated badge reader lockout synced at lab entryway door.
          </text>
        </g>
      </g>
    </g>

    <!-- COL 3: REAL-TIME ASSET TELEMETRY & SIGN-OFF (Width: 480) -->
    <g transform="translate(1024, 0)" filter="url(#wpc-shadow)">
      <rect width="480" height="660" rx="14" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
      <g transform="translate(24, 28)">
        <text x="0" y="0" fill="#18181B" font-size="16" font-weight="800">3. Equipment &amp; Sign-off Checklist</text>
        <text x="0" y="20" fill="#71717A" font-size="12">Real-time instrument interlocks &amp; formal approvals</text>

        <!-- Equipment 1 -->
        <g transform="translate(0, 42)">
          <rect width="432" height="64" rx="8" fill="#F4F4F5"/>
          <text x="16" y="26" fill="#18181B" font-size="12" font-weight="700">Ti:Sapphire Laser Oscillator (Asset #4810)</text>
          <text x="16" y="44" fill="#71717A" font-size="11">Coolant Temp: 19.4°C · Calibration: ACTIVE</text>
          <rect x="330" y="16" width="86" height="24" rx="12" fill="#DCFCE7"/>
          <text x="373" y="32" fill="#15803D" font-size="10" font-weight="800" text-anchor="middle">ONLINE ✓</text>
        </g>

        <!-- Equipment 2 -->
        <g transform="translate(0, 116)">
          <rect width="432" height="64" rx="8" fill="#F4F4F5"/>
          <text x="16" y="26" fill="#18181B" font-size="12" font-weight="700">Automated Shutter Containment System</text>
          <text x="16" y="44" fill="#71717A" font-size="11">Emergency E-Stop Loop: CLOSED &amp; READY</text>
          <rect x="330" y="16" width="86" height="24" rx="12" fill="#DCFCE7"/>
          <text x="373" y="32" fill="#15803D" font-size="10" font-weight="800" text-anchor="middle">ENGAGED ✓</text>
        </g>

        <!-- Equipment 3 -->
        <g transform="translate(0, 190)">
          <rect width="432" height="64" rx="8" fill="#F4F4F5"/>
          <text x="16" y="26" fill="#18181B" font-size="12" font-weight="700">Exhaust Fume &amp; Ozone Extraction</text>
          <text x="16" y="44" fill="#71717A" font-size="11">Airflow: 850 CFM · Pressure: NOMINAL</text>
          <rect x="330" y="16" width="86" height="24" rx="12" fill="#DCFCE7"/>
          <text x="373" y="32" fill="#15803D" font-size="10" font-weight="800" text-anchor="middle">NOMINAL ✓</text>
        </g>

        <!-- Facility Lead Sign-off Box -->
        <g transform="translate(0, 276)">
          <rect width="432" height="170" rx="10" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.5"/>
          <text x="16" y="28" fill="#6B21A8" font-size="14" font-weight="800">Facility Director Formal Authorization</text>
          <text x="16" y="50" fill="#7E22CE" font-size="12">
            Authorized by: Dr. Robert Vance, Lab Facility Lead
          </text>
          <text x="16" y="68" fill="#9333EA" font-size="11">
            Digital Signature: RSA-4096 Timestamped 08:30:14 MT
          </text>

          <rect x="16" y="86" width="400" height="42" rx="8" fill="#7C3AED"/>
          <text x="216" y="112" fill="#FFFFFF" font-size="13" font-weight="800" text-anchor="middle">ACTIVE EXPERIMENT RUNNING</text>
        </g>

        <!-- Emergency Shutdown Button -->
        <g transform="translate(0, 470)">
          <rect width="432" height="50" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
          <text x="216" y="31" fill="#DC2626" font-size="12" font-weight="800" text-anchor="middle">🛑 EMERGENCY FACILITY SHUTDOWN / E-STOP</text>
        </g>
      </g>
    </g>
  </g>
</svg>
